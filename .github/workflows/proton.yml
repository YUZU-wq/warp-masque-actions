name: 取 Proton 凭据

on:
  workflow_dispatch:
  # 证书 7 天到期。注意 cron 的 */6 是"日期能被 6 整除"，不是"每隔 6 天"，
  # 月末衔接会不均匀。取每 3 天跑一次，失败一次也还有余量。
  schedule:
    - cron: '0 3 */3 * *'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 装依赖
        run: |
          set -euo pipefail
          # 官方库自带 SRP 实现，不用自己写。
          # 它验 Modulus 的 PGP 签名要 gpg，runner 自带。
          pip install -q "git+https://github.com/ProtonVPN/python-proton-core.git" cryptography
          gpg --version | head -1

      - name: 登录并生成凭据
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
          # 可选。账号没开 2FA 就不用配，留空不影响。
          PROTON_TOTP_SECRET: ${{ secrets.PROTON_TOTP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PROTON_USER:-}" ] || [ -z "${PROTON_PASS:-}" ]; then
            echo "缺 secrets。到 Settings > Secrets and variables > Actions"
            echo "加 PROTON_USER（Proton 邮箱）和 PROTON_PASS（密码）"
            exit 1
          fi
          python3 scripts/gen_proton.py dist

      - name: 推送到 Worker
        env:
          URL: ${{ secrets.WORKER_PUSH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "没配 WORKER_PUSH_URL，跳过推送。凭据在 artifact 里，可手动粘贴。"
            exit 0
          fi
          # 令牌就在地址里，所以只需要这一个 secret
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$URL" \
            --data-binary @dist/proton-blob.txt)
          echo "HTTP $CODE"
          cat /tmp/resp.json; echo
          # 404 = 令牌不对（故意不区分"路径不存在"和"没权限"）
          [ "$CODE" = "200" ] || { echo "推送失败"; exit 1; }

      - name: 摘要
        if: always()
        env:
          # 判断有没有配 secret，用比较表达式渲染出 true/false，
          # 这样 secret 的原文（带令牌的推送地址、邮箱）一个字节都不会进日志。
          # 直接写 ${{ secrets.X }} 是不行的：${{ }} 的渲染结果会出现在
          # step 开头的 "Run" 里，掩码只遮注册值，照样泄露。
          PUSH_SET: ${{ secrets.WORKER_PUSH_URL != '' }}
          AUTH_SET: ${{ secrets.PROTON_USER != '' }}
        run: |
          {
            echo '## Proton 凭据'
            echo
            if [ ! -s dist/proton-blob.txt ]; then
              if [ "$AUTH_SET" != "true" ]; then
                echo '没配 PROTON_USER / PROTON_PASS 这两个 secret，流水线不会跑登录。'
                echo '到 Settings > Secrets and variables > Actions 加上，再手动重跑本流水线。'
              else
                echo '生成失败，看上面的日志。'
              fi
            elif [ "$PUSH_SET" = "true" ]; then
              echo '证书到手。已自动推送到 Worker，配置随即更新。'
              echo
              echo '证书 7 天有效，本流水线每 3 天自动跑一次，不用手动管。'
            else
              # 仓库是 public 的：日志、summary、artifact 都要登录才看得到，
              # 但 public 仓库人人有读权限，等于任何一个免费注册的 GitHub
              # 账号都能拿到。这段 blob 里含 WireGuard 私钥（绑 Proton
              # 账号，7 天内可直接冒充设备），所以不往 summary 里打，
              # 只留个指纹让你能核对下到的 artifact 是不是这次跑的。
              echo '证书到手，但没配 WORKER_PUSH_URL，没推送。'
              echo
              echo '完整凭据在 artifact **proton-blob** 里（登录下载，保留 7 天）。'
              echo '私钥不往这页面上打，只给指纹：'
              echo
              echo '```'
              echo "sha256 $(sha256sum dist/proton-blob.txt | cut -c1-16)"
              echo "size   $(wc -c < dist/proton-blob.txt | tr -d ' ') bytes"
              echo '```'
              echo
              echo '要么下 artifact 手动粘贴，要么配上 WORKER_PUSH_URL 让它自动推。'
              echo
              # 别让"去下 artifact"变成假的安全感：那只是换个地方暴露，
              # 同一个仓库的读权限覆盖两者。
              echo '> ⚠️ 本仓库是 public，artifact 任何一个 GitHub 账号都能下，'
              echo '> 私钥只是换了个地方摆着。想真收干净：把仓库转私有，'
              echo '> 或者配上 WORKER_PUSH_URL 让凭据直接进 Worker、不经过 GitHub 存管。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        # 用 always() 而不是 success()：摘要已经不打印 blob 了，artifact 就是
        # 唯一的副本。要是推送步骤失败（比如令牌换过、404）就不上传，
        # 这张刚申请下来的证书会跟着 job 一起丢，只能重跑一遍登录。
        # windscribe.yml 本来就是这么写的。
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proton-blob
          path: dist/proton-blob.txt
          retention-days: 7
          if-no-files-found: ignore
